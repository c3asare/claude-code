name: parked
description: Multi-car parking locator with auto-detect and street-sweeping alerts.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  parked_core:
  parked_data:
  parked_sensing: # imported ONLY from lib/bootstrap/mobile_*.dart and main_mobile.dart
  flutter_riverpod: ^2.6.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
