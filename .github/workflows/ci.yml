name: CI
on:
  push:
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/parked_data
      - run: dart test
        working-directory: packages/parked_core
      - run: flutter test
        working-directory: packages/parked_data
      - run: flutter analyze
        working-directory: packages/parked_core
      - run: flutter analyze
        working-directory: packages/parked_data
      - run: flutter analyze
        working-directory: packages/parked_sensing
      - run: flutter analyze
        working-directory: apps/parked
      - run: flutter test
        working-directory: apps/parked

  android:
    needs: dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/parked_data
      - run: flutter build apk --debug -t lib/main_mobile.dart
        working-directory: apps/parked

  ios:
    needs: dart
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/parked_data
      - run: flutter build ios --debug --no-codesign -t lib/main_mobile.dart
        working-directory: apps/parked
